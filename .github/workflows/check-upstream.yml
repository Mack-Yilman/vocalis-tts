name: Vigilante de Piper y voces

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-upstream.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
