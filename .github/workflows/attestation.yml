name: Artifact Attestation

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  attest:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Artifact Attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

